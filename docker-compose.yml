version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dq_guardian
      POSTGRES_USER: dqg
      POSTGRES_PASSWORD: dqg
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
