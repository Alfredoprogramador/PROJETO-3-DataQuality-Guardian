# Camada 6 — External Secrets Operator
# Syncs secrets from HashiCorp Vault into Kubernetes Secrets.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: dqg
spec:
  provider:
    vault:
      server: "http://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
# Sync backend secrets from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: dqg
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: dqg/backend
        property: jwt_secret_key
    - secretKey: AUDIT_HMAC_KEY
      remoteRef:
        key: dqg/backend
        property: audit_hmac_key
    - secretKey: FIELD_ENCRYPTION_KEY_HEX
      remoteRef:
        key: dqg/backend
        property: field_encryption_key_hex
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dqg/backend
        property: oidc_client_secret
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: dqg/postgres
        property: password
